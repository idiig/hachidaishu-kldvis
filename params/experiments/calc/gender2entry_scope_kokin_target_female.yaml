# Same question as gender2entry_scope_first4_target_female.yaml (measure
# each entry's divergence against the female slice as context, over the
# F/M/U population) -- the only difference is SOURCE's own scope: kokin
# alone (entry_by_gender_scope_kokin.yaml's own single "filter" step)
# instead of the first four anthologies (2026-10-18, user request "entry
# by gender in scope kokin"). See gender2entrypair_first4.yaml's own
# header for the full field-by-field schema this still shares.
#
# SCOPE here (the crosstable denominator, [[F, M, U]]) is unchanged from
# the first4 sibling -- it's the gender population, not a set of
# anthology names; only the LINE universe match/population/dispersion
# are computed over has shrunk to kokin's own lines.
#
# CONDITION2 pins LEVEL1 to F -- target=female, same convention every
# other gender-target calc yaml in this project uses.

- source: ../data/entry_by_gender_scope_kokin.yaml
  structure:
    level1: 性別
    level2: 語
    value: {match, population}
  scope: [[F, M, U]]
  condition1: {field: level2}
  condition2: {field: level1, value: [F]}
  direction: [forward, backward]
  frequency_type: [doc, term]
  kld_variant: [nofreq, obs]
  # measured_value (level2) is a single entry -- dispersion off the
  # matching kokin-scoped entry_by_line_scope_kokin.yaml index.
  # target_value is gender (level1) -- target_dispersion off gender_by_
  # line_scope_kokin.yaml's own 2-level Level2Index, same non-degenerate
  # full-scope construction as the first4 sibling's own aux comment.
  # measured_dispersion_target/_reference (2026-10-18 follow-up): the
  # D_T - D_R split (dispersion_difference), gender-scoped within kokin
  # only -- see entry_by_line_scope_kokin_gender_female.yaml/_not_female.
  # yaml's own headers for why this needs pair_statistics.entry_
  # dispersion_target/_reference instead of a plain filter.
  aux:
    measured_dispersion: ../data/dispersion/entry_by_line_scope_kokin.yaml
    target_dispersion: ../data/dispersion/gender_by_line_scope_kokin.yaml
    measured_dispersion_target: ../data/dispersion/entry_by_line_scope_kokin_gender_female.yaml
    measured_dispersion_reference: ../data/dispersion/entry_by_line_scope_kokin_gender_not_female.yaml
