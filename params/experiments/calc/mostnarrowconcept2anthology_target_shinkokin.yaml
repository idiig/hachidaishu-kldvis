# Single-entry analogue of anthology2entry_target_shinkokin.yaml (see
# that file's own header for the full field-by-field schema) -- same
# question (measure each LEVEL2's divergence against shinkokin as
# context, over the 8-anthology corpus), but LEVEL2 here is a concept
# (もっとも狭い分類語彙表番号、climbしない -- concept2l2entry_exclusion.
# entry_mostnarrow_concepts参照) instead of a lexical entry (語) --
# same LEVEL2 swap mostnarrowconcept2gender_scope_first4_target_female.
# yaml already made relative to gender2entry_scope_first4_target_
# female.yaml.
#
# aux mirrors anthology2entry_target_shinkokin.yaml's own pair exactly,
# swapping every LEVEL2 dispersion source for its concept equivalent:
# measured_dispersion/_target/_reference are mostnarrowconcept_by_line_
# scope_all/_shinkokin/_not_shinkokin.yaml (the concept's own all8/
# shinkokin-only/other7-only dispersion, anthology-independent).
# target_dispersion stays anthology_by_line_scope_all.yaml unchanged
# (LEVEL1/target is still anthology here, not gender/budatemajor).

- source: ../data/mostnarrowconcept_by_anthology_scope_all.yaml
  structure:
    level1: 和歌集
    level2: 概念
    value: {match, population}
  scope: [[kokin, gosen, shuui, goshuui, kinyo, shika, senzai, shinkokin]]
  condition1: {field: level2}
  condition2: {field: level1, value: [shinkokin]}
  direction: [forward, backward]
  frequency_type: [doc, term]
  kld_variant: [nofreq, obs]
  aux:
    measured_dispersion: ../data/dispersion/mostnarrowconcept_by_line_scope_all.yaml
    target_dispersion: ../data/dispersion/anthology_by_line_scope_all.yaml
    measured_dispersion_target: ../data/dispersion/mostnarrowconcept_by_line_scope_shinkokin.yaml
    measured_dispersion_reference: ../data/dispersion/mostnarrowconcept_by_line_scope_not_shinkokin.yaml
